# Windows Release x64, then macOS Default universal, from one immutable source.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: screen-capture
  MACOS_DEPLOYMENT_TARGET: '11.0'
  BASE_DIR: test
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate source and publication absence before native work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Check clean selected Windows checkout before native work
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/release.py preflight --sha "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: clean stale outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/native.py clean-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      - name: normalize windows output to canonical case
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/native.py normalize-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.BASE_DIR }}/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild
      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate
      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials
      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build
      - name: verify universal binary
        run: |
          bash .github/scripts/native.sh verify
          python3 .github/scripts/source_version.py --verify-bundle "$BASE_DIR/Plugins/$PRODUCT_NAME.bundle"
      - name: merge Windows binaries into the bundle
        run: bash .github/scripts/native.sh merge
      - name: codesign
        run: bash .github/scripts/native.sh sign
      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/native.sh package
      - name: Revalidate retained outputs and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "screen-capture-${VERSION}.zip" "screen-capture-${VERSION}.dmg"
